[package]
name = "lgtv-companion-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lgtv-companion-runtime = { path = "../runtime" }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
x11rb = { version = "0.13", features = ["dpms", "randr", "screensaver"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
